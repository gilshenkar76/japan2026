<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>יום 18 – השוואת מסלולים</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; }
  h1 { text-align: center; padding: 14px; font-size: 18px; background: #1e293b; color: #fff; }
  .legend-bar {
    display: flex; justify-content: center; gap: 32px; padding: 10px 16px;
    background: #fff; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .legend-line { width: 36px; height: 4px; border-radius: 2px; }
  .orig { background: #ef4444; }
  .alt  { background: #3b82f6; }
  #map  { height: calc(100vh - 110px); }
  .note { text-align: center; padding: 6px; background: #fef9c3; font-size: 12px; color: #854d0e; border-bottom: 1px solid #fde68a; }
</style>
</head>
<body>
<h1>יום 18 – קיוטו: השוואת מסלולים</h1>
<div class="legend-bar">
  <div class="legend-item"><div class="legend-line orig"></div><span>מסלול מקורי – Ryoan-ji Temple</span></div>
  <div class="legend-item"><div class="legend-line alt"></div><span>מסלול חלופי – Nijo Castle</span></div>
</div>
<div class="note">⚠️ שני המסלולים זהים עד Tenryu-ji; ההבדל הוא מ-Arashiyama הלאה</div>
<div id="map"></div>
<script>
const map = L.map('map').setView([35.020, 135.725], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

// ── Coordinates ─────────────────────────────────────────────────────────────
const stops = {
  fushimi:   { latlng: [34.9671, 135.7727], label: '① Fushimi Inari Taisha',     num: '①', shared: true  },
  bamboo:    { latlng: [35.0170, 135.6722], label: '② Arashiyama Bamboo Grove',   num: '②', shared: true  },
  tenryuji:  { latlng: [35.0168, 135.6755], label: '③ Tenryu-ji Temple',           num: '③', shared: true  },
  lunch:     { latlng: [35.0160, 135.6730], label: '④ ארוחת צהריים (Arashiyama)', num: '④', shared: true  },
  ryoanji:   { latlng: [35.0343, 135.7185], label: '⑤ Ryoan-ji Temple',            num: '⑤', shared: false, orig: true  },
  nijo:      { latlng: [35.0143, 135.7480], label: '⑤ Nijo Castle',                num: '⑤', shared: false, alt:  true  },
  kinkakuji: { latlng: [35.0394, 135.7292], label: '⑥ Kinkaku-ji',                 num: '⑥', shared: true  },
  gion:      { latlng: [35.0036, 135.7756], label: '⑦ רובע גיון',                  num: '⑦', shared: true  },
};

// ── Route polylines ──────────────────────────────────────────────────────────
const sharedPart    = [stops.fushimi, stops.bamboo, stops.tenryuji, stops.lunch].map(s => s.latlng);
const origRoute     = [...sharedPart, stops.ryoanji.latlng, stops.kinkakuji.latlng, stops.gion.latlng];
const altRoute      = [...sharedPart, stops.nijo.latlng,    stops.kinkakuji.latlng, stops.gion.latlng];

L.polyline(origRoute, { color: '#ef4444', weight: 4, opacity: 0.85, dashArray: null }).addTo(map);
L.polyline(altRoute,  { color: '#3b82f6', weight: 4, opacity: 0.85, dashArray: '8 6' }).addTo(map);

// ── Markers ──────────────────────────────────────────────────────────────────
function makeIcon(color, num) {
  return L.divIcon({
    className: '',
    html: `<div style="
      background:${color};color:#fff;font-weight:800;font-size:13px;
      width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
      font-family:Segoe UI,Arial,sans-serif;">${num}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
  });
}

// Shared stops
[stops.fushimi, stops.bamboo, stops.tenryuji, stops.lunch, stops.kinkakuji, stops.gion].forEach(s => {
  L.marker(s.latlng, { icon: makeIcon('#64748b', s.num) })
   .bindPopup(`<b>${s.label}</b><br><span style="color:#64748b;font-size:12px">משותף לשני המסלולים</span>`)
   .addTo(map);
});

// Ryoan-ji (original only)
L.marker(stops.ryoanji.latlng, { icon: makeIcon('#ef4444', '⑤') })
 .bindPopup(`<b>${stops.ryoanji.label}</b><br>
   <span style="color:#ef4444;font-weight:700">מסלול מקורי בלבד</span><br>
   <span style="font-size:12px;color:#475569">מגן האבנים המפורסם. מרחק הליכה ~800 מ' מ-Kinkaku-ji ✓<br>
   נסיעה מ-Arashiyama: ~35 דק'</span>`)
 .addTo(map);

// Nijo Castle (alternative only)
L.marker(stops.nijo.latlng, { icon: makeIcon('#3b82f6', '⑤') })
 .bindPopup(`<b>${stops.nijo.label}</b><br>
   <span style="color:#3b82f6;font-weight:700">מסלול חלופי בלבד</span><br>
   <span style="font-size:12px;color:#475569">טירת הטוקוגאווה. מרחק מ-Arashiyama: ~20 דק' ✓<br>
   אך לאחר מכן חוזרים צפון-מערב ל-Kinkaku-ji: ~25 דק' ← zigzag!</span>`)
 .addTo(map);

// ── Distance annotation arrows ──────────────────────────────────────────────
// Label midpoints of key segments
function midpoint(a, b) { return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }

const segLabels = [
  { latlng: midpoint(stops.tenryuji.latlng, stops.ryoanji.latlng),   text: '🔴 ~35 דק׳', color: '#ef4444' },
  { latlng: midpoint(stops.tenryuji.latlng, stops.nijo.latlng),      text: '🔵 ~20 דק׳', color: '#3b82f6' },
  { latlng: midpoint(stops.ryoanji.latlng,  stops.kinkakuji.latlng), text: '🔴 ~15 דק׳ רגלי', color: '#ef4444' },
  { latlng: midpoint(stops.nijo.latlng,     stops.kinkakuji.latlng), text: '🔵 ~25 דק׳', color: '#3b82f6' },
  { latlng: midpoint(stops.kinkakuji.latlng, stops.gion.latlng),     text: '~35 דק׳', color: '#64748b' },
];

segLabels.forEach(s => {
  L.marker(s.latlng, {
    icon: L.divIcon({
      className: '',
      html: `<div style="background:#fff;border:1px solid ${s.color};color:${s.color};
        font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;
        white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)">${s.text}</div>`,
      iconAnchor: [30, 12],
    }),
    interactive: false,
  }).addTo(map);
});
</script>
</body>
</html>
